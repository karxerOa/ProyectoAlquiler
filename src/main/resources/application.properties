spring.application.name=ProyectoAlquiler
server.port=${SERVER_PORT:9494}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ProyectoAlquiler}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
spring.config.import=optional:file:./config/local-secrets.properties
